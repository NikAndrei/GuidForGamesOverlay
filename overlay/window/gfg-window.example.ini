; Настройки прозрачного окна (необязательны). Переименовать в gfg-window.ini рядом с gfg-window.exe.
[GuidForGames]
; Где сервис.
Host=127.0.0.1
Port=7871
; Клавиша вызова, как в ReShade: код, Ctrl, Shift, Alt (112 — F1). По умолчанию Shift+F1.
Hotkey=112,0,1,0
; 0 — не открывать справку с контроллера (View + R3).
GamepadCombo=1
; Шрифт с кириллицей и его размер.
Font=C:\Windows\Fonts\segoeui.ttf
FontSize=19
