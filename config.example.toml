# Настройки сервиса. Скопировать в config.toml (он не в git) и поправить пути.
# Относительные пути — от папки этого файла.

# Отладочная страница и HTTP API.
http = "127.0.0.1:7870"
# Протокол для оверлея (аддон ReShade): JSON по строкам через TCP. См. service/README.md.
overlay = "127.0.0.1:7871"
# Своё состояние сервиса: раскрытые подсказки, копии сейвов.
state_dir = "state"

[[game]]
adapter = "dd2"
# Подсказки: папка data/<game-id> из GuidForGames (с save-map.json) или файл пакета из GuidForGames-packs.
content = "../GuidForGames/data/dragons-dogma-2"
# Правила «состояние → подсказка».
rules = "hints/dd2"
# Мод-мост REFramework из GuidForGames пишет сюда guidforgames_live.json и guidforgames_state.json.
mod_dir = 'C:\Program Files (x86)\Steam\steamapps\common\Dragons Dogma 2\reframework\data'
# Сейвы и утилита их разбора (tools/bin/dd2-save.exe из GuidForGames). Можно не задавать, если стоит мод.
save_dir = 'C:\Program Files (x86)\Steam\userdata\<номер аккаунта>\2054970\remote\win64_save'
save_tool = "../GuidForGames/tools/bin/dd2-save.exe"
# SteamID64 или номер аккаунта; если не задан — берётся из пути save_dir (userdata\<номер>).
# steam_id = "..."
# save_map — путь к save-map.json, если content — файл пакета (в пакете его нет).
