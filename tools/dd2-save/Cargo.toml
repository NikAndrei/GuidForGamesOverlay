[package]
name = "dd2-save"
version = "0.1.0"
edition = "2024"
description = "Читает (только чтение) сохранение Dragon's Dogma 2 и выводит состояние квестов в JSON"

[dependencies]
# Расшифровка и разбор сохранений RE Engine: https://github.com/kvasszn/ree-save-editor
ree-lib = { git = "https://github.com/kvasszn/ree-save-editor", rev = "4125e497f1ae84cc746bb4a99da612c48bea161e", default-features = false }
util = { git = "https://github.com/kvasszn/ree-save-editor", rev = "4125e497f1ae84cc746bb4a99da612c48bea161e" }
serde_json = "1"
